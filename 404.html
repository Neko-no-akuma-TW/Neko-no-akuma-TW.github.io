<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 找不到頁面 | Neko no akuma</title>
  <!-- 設置 favicon -->
  <link rel="icon" type="image/png" href="https://cdn.dybts.qzz.io/images/neko_icon.png">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f8f9fa;
      --text-color: #333;
      --card-bg: #ffffff;
      --hover-color: #0056b3;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 1.5rem;
      border: 4px solid var(--primary-color);
      object-fit: cover;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      color: var(--primary-color);
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-color);
    }

    .description {
      font-size: 1rem;
      color: #666;
      margin-bottom: 2rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      padding: 12px 25px;
      background-color: var(--primary-color);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .back-btn i {
      margin-right: 10px;
    }

    .back-btn:hover {
      background-color: var(--hover-color);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="avatar" src="https://cdn.dybts.qzz.io/images/neko_icon.png" alt="Neko no akuma">
    <h1>404</h1>
    <h2>找不到此頁面</h2>
    <p class="description">Discord 機器人 DYBTS 運營者</p>
    <p class="description">抱歉，您所尋找的頁面不存在或是已被移動。</p>

    <a href="/" class="back-btn">
      <i class="fas fa-home"></i>
      回到首頁
    </a>

    <footer>
      &copy; 2026 Neko no akuma. All rights reserved.
    </footer>
  </div>
</body>
</html>
