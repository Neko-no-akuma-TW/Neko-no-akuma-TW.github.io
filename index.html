<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Neko no akuma 的個人導航站 - Discord機器人、遊戲工具、神椿粉絲專區">
  <title>🐾 Neko no akuma | 個人導航站</title>
  <link rel="icon" href="https://cdn.dybts.qzz.io/images/neko_icon.png" type="image/png">
  
  <!-- 📊 Umami 隱私友善統計 - 請替換 YOUR_UMAMI_WEBSITE_ID -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="91121bed-e697-4fdb-b6a9-ab7ab8f5f50e"></script>
  
  <style>
    :root {
      --bg: #f8f9fa; --card-bg: #ffffff; --text: #212529;
      --text-muted: #6c757d; --accent: #9b59b6; --accent-hover: #8e44ad;
      --border: #e9ecef; --shadow: 0 4px 12px rgba(0,0,0,0.1);
      --neko-gradient: linear-gradient(135deg, #9b59b6, #3498db);
      --toggle-bg: #e9ecef; --toggle-ball: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f1a; --card-bg: #1a1a2e; --text: #f0f0f5;
        --text-muted: #a0a0b0; --accent: #b388ff; --accent-hover: #9575cd;
        --border: #2a2a4a; --shadow: 0 4px 16px rgba(0,0,0,0.4);
        --neko-gradient: linear-gradient(135deg, #b388ff, #64b5f6);
        --toggle-bg: #2a2a4a; --toggle-ball: #f0f0f5;
      }
    }
    [data-theme="dark"] {
      --bg: #0f0f1a; --card-bg: #1a1a2e; --text: #f0f0f5;
      --text-muted: #a0a0b0; --accent: #b388ff; --accent-hover: #9575cd;
      --border: #2a2a4a; --shadow: 0 4px 16px rgba(0,0,0,0.4);
      --neko-gradient: linear-gradient(135deg, #b388ff, #64b5f6);
      --toggle-bg: #2a2a4a; --toggle-ball: #f0f0f5;
    }
    [data-theme="light"] {
      --bg: #f8f9fa; --card-bg: #ffffff; --text: #212529;
      --text-muted: #6c757d; --accent: #9b59b6; --accent-hover: #8e44ad;
      --border: #e9ecef; --shadow: 0 4px 12px rgba(0,0,0,0.1);
      --neko-gradient: linear-gradient(135deg, #9b59b6, #3498db);
      --toggle-bg: #e9ecef; --toggle-ball: #ffffff;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6; padding: 2rem 1rem;
      background-image: radial-gradient(circle at 10% 20%, rgba(155,89,182,0.08) 0%, transparent 25%),
                        radial-gradient(circle at 90% 80%, rgba(52,152,219,0.08) 0%, transparent 25%);
      transition: background 0.3s, color 0.3s;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header { 
      text-align: center; margin-bottom: 2.5rem; padding: 1.5rem;
      background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border);
      box-shadow: var(--shadow); max-width: 700px; margin: 0 auto;
      position: relative;
    }
    .theme-toggle {
      position: absolute; top: 1rem; right: 1rem;
      width: 44px; height: 24px; background: var(--toggle-bg);
      border-radius: 12px; cursor: pointer; border: none;
      display: flex; align-items: center; padding: 2px;
      transition: background 0.3s;
    }
    .theme-toggle::after {
      content: '🌙'; font-size: 14px;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--toggle-ball); display: flex;
      align-items: center; justify-content: center;
      transition: transform 0.3s ease;
    }
    [data-theme="dark"] .theme-toggle::after {
      content: '☀️'; transform: translateX(20px);
    }
    .avatar {
      width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 1rem;
      background: var(--neko-gradient); padding: 3px; display: block;
    }
    .avatar img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      background: var(--card-bg); border: 3px solid var(--card-bg);
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.3rem; background: var(--neko-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: var(--text-muted); margin-bottom: 1.2rem; font-size: 0.95rem; }
    #search {
      width: 100%; max-width: 420px; padding: 0.8rem 1rem;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--bg); color: var(--text); font-size: 1rem;
      transition: all 0.2s;
    }
    #search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(155,89,182,0.25); }
    main { max-width: 1200px; margin: 0 auto; flex: 1; }
    .category { margin-bottom: 2.5rem; }
    .category h2 {
      font-size: 1.25rem; margin-bottom: 1rem; padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--accent); display: inline-block;
      color: var(--accent);
    }
    .links-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem;
    }
    .link-card {
      display: block; background: var(--card-bg); padding: 1.4rem;
      border-radius: 14px; border: 1px solid var(--border);
      box-shadow: var(--shadow); text-decoration: none; color: inherit;
      transition: all 0.25s ease; position: relative; overflow: hidden;
    }
    .link-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--neko-gradient); opacity: 0; transition: opacity 0.2s;
    }
    .link-card:hover {
      transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      border-color: var(--accent);
    }
    .link-card:hover::before { opacity: 1; }
    .link-card h3 { 
      margin-bottom: 0.5rem; color: var(--accent); font-size: 1.15rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .link-card h3::before { content: '🔗'; font-size: 1rem; }
    .link-card.discord h3::before { content: '🤖'; }
    .link-card.giveaway h3::before { content: '🎁'; }
    .link-card.game h3::before { content: '🎮'; }
    .link-card.kamitsubaki h3::before { content: '🎵'; }
    .link-card.social h3::before { content: '🌐'; }
    .link-card.github h3::before { content: '💻'; }
    .link-card p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }
    .badge {
      display: inline-block; padding: 0.2rem 0.5rem; border-radius: 6px;
      font-size: 0.75rem; font-weight: 500; margin-left: 0.5rem;
      background: var(--accent); color: white;
    }
    footer {
      text-align: center; margin-top: auto; padding-top: 1.5rem; padding-bottom: 1rem;
      border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.9rem;
    }
    .hidden { display: none !important; }
    
    /* 🎁 彩蛋動畫樣式 */
    .neko-emoji {
      position: fixed; font-size: 2rem; pointer-events: none;
      animation: float-up 1.5s ease-out forwards; z-index: 9999;
    }
    @keyframes float-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
    }
    
    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      .links-grid { grid-template-columns: 1fr; }
      .theme-toggle { top: 0.8rem; right: 0.8rem; }
    }
  </style>
</head>
<body>
  <header>
    <button class="theme-toggle" id="themeToggle" aria-label="切換深色/淺色模式"></button>
    <span class="avatar">
      <img src="https://cdn.dybts.qzz.io/images/neko_icon.png" alt="Neko no akuma ICON">
    </span>
    <h1>🐾 Neko no akuma</h1>
    <p class="subtitle">Discord 機器人開發者｜神椿粉絲｜遊戲工具愛好者</p>
    <input type="text" id="search" placeholder="🔍 搜尋網站、機器人或工具..." aria-label="搜尋連結">
  </header>

  <main id="links-container"></main>

  <footer>
    <p>© <span id="year"></span> Neko no akuma | 🐾 用愛與程式碼打造的小小宇宙</p>
    <p style="margin-top: 0.5rem; font-size: 0.85rem;">
      最後更新：<span id="update-date"><!--BUILD_TIME_PLACEHOLDER--></span>
    </p>
  </footer>

  <script>
    // 🗂️ JSON 資料驅動：所有連結集中管理，新增/修改只需編輯此陣列
    const siteData = [
      {
        category: "🤖 Discord 機器人",
        links: [
          {
            title: "DYBTS 官網",
            url: "https://dybts.us.kg",
            desc: "主打多功能伺服器管理：客服單系統、歡迎訊息、氣象署天氣查詢、地震報告推播，整合政府開放資料，讓伺服器管理更智慧。",
            badge: "多功能",
            class: "discord"
          },
          {
            title: "GDYBTS 官網",
            url: "https://giveaway.dybts.us.kg",
            desc: "專為抽獎而生的 Discord 機器人，介面直觀、設定簡單，讓每個社群都能快速舉辦公平又有趣的抽獎活動。",
            badge: "抽獎專用",
            class: "giveaway"
          }
        ]
      },
      {
        category: "🎮 遊戲輔助工具",
        links: [
          {
            title: "明日方舟終末地簽到助手",
            url: "https://endfield-asst.dybts.us.kg",
            desc: "自動完成網頁簽到流程，不用每天手動開啟網站或 App，輕鬆領取每日獎勵，省時又省力。",
            class: "game"
          }
        ]
      },
      {
        category: "🎵 神椿粉絲專區",
        links: [
          {
            title: "神椿資訊站",
            url: "https://kamitsubaki.dpdns.org",
            desc: "整理神椿工作室（Kamitsubaki Studio）旗下藝人、MV、專輯與活動資訊，粉絲必備情報站。",
            class: "kamitsubaki"
          },
          {
            title: "台灣神椿粉絲活動組",
            url: "https://www.kamitsubaki.art",
            desc: "推廣台灣在地神椿粉絲活動：線下聚會、應援企劃、翻譯協作，連結同好一起支持喜歡的作品。",
            class: "kamitsubaki"
          },
          {
            title: "神椿魔女交流社 Discord社群",
            url: "https://discord.gg/VunJzQgeq5",
            desc: "加入神椿魔女交流社，跟同推的網友互動吧！",
            class: "kamitsubaki"
          },
		  {
			title: "神椿人格測驗",
			url: "https://test.kamitsubaki.qzz.io",
			desc: "來看看你是神椿的哪一位成員吧！",
			class: "kamitsubaki"
		  }
        ]
      },
      {
        category: "🌐 社群與聯絡",
        links: [
          {
            title: "GitHub",
            url: "https://github.com/Neko-no-akuma-TW",
            desc: "查看我的開源專案、機器人原始碼與技術實驗，歡迎 Star、Fork 或提出 Issue 交流！",
            class: "github"
          },
          {
            title: "YouTube 頻道",
            url: "https://youtube.com/@neko_tw",
            desc: "@neko_tw｜分享機器人教學、遊戲實況、神椿相關內容，歡迎訂閱追蹤！",
            class: "social"
          },
          {
            title: "Discord 社群",
            url: "https://discord.gg/7AHak4nSbE",
            desc: "加入官方伺服器，獲取機器人更新通知、參與活動、與其他使用者交流問題與想法。",
            class: "discord"
          }
        ]
      }
    ];

    // 🔧 動態渲染連結卡片
    function renderLinks(data) {
      const container = document.getElementById('links-container');
      if (!container) return;
      container.innerHTML = '';
      
      data.forEach(section => {
        const sectionEl = document.createElement('section');
        sectionEl.className = 'category';
        sectionEl.innerHTML = `<h2>${section.category}</h2><div class="links-grid"></div>`;
        const grid = sectionEl.querySelector('.links-grid');
        
        section.links.forEach(link => {
          const card = document.createElement('a');
          card.href = link.url;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          card.className = `link-card ${link.class || ''}`;
          card.innerHTML = `
            <h3>${link.title}${link.badge ? `<span class="badge">${link.badge}</span>` : ''}</h3>
            <p>${link.desc}</p>
          `;
          grid.appendChild(card);
        });
        
        container.appendChild(sectionEl);
      });
    }
    
    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      // 1️⃣ 渲染連結
      renderLinks(siteData);
      
      // 2️⃣ 搜尋功能
      const searchInput = document.getElementById('search');
      if (searchInput) {
        searchInput.addEventListener('input', function(e) {
          const query = e.target.value.toLowerCase().trim();
          document.querySelectorAll('.link-card').forEach(card => {
            const text = card.textContent.toLowerCase();
            card.classList.toggle('hidden', query && !text.includes(query));
          });
          document.querySelectorAll('.category').forEach(cat => {
            const hasVisible = cat.querySelector('.link-card:not(.hidden)');
            cat.style.display = hasVisible ? 'block' : 'none';
          });
        });
      }
      
      // 3️⃣ 深色/淺色切換
      const toggle = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('neko-theme');
      
      function applyTheme(theme) {
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('neko-theme', theme);
        } else {
          document.documentElement.removeAttribute('data-theme');
          localStorage.removeItem('neko-theme');
        }
      }
      
      if (savedTheme) {
        applyTheme(savedTheme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        applyTheme('dark');
      }
      
      if (toggle) {
        toggle.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'dark' ? 'light' : 'dark';
          applyTheme(next);
          toggle.style.transform = 'scale(0.9)';
          setTimeout(() => toggle.style.transform = '', 150);
        });
      }
      
      // 4️⃣ 年份
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();
      
      // 5️⃣ 🕒 更新時間 fallback（防止 Actions 替換失敗）
      const updateEl = document.getElementById('update-date');
      if (updateEl) {
        const text = updateEl.textContent.trim();
        if (!text || text === '' || text.includes('BUILD_TIME_PLACEHOLDER')) {
          // Actions 替換失敗或本地開啟時，顯示本地時間
          const now = new Date();
          const formatted = now.toLocaleString('zh-TW', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit',
            timeZone: 'Asia/Taipei', hour12: false
          });
          updateEl.textContent = formatted + (text.includes('BUILD_TIME_PLACEHOLDER') ? ' (本地)' : '');
          console.log('⚠️ Build time placeholder not replaced, using local fallback');
        }
      }
      
      // 6️⃣ 🖱️ Umami 點擊追蹤
      if (typeof umami !== 'undefined') {
        document.querySelectorAll('.link-card').forEach(card => {
          card.addEventListener('click', () => {
            const title = card.querySelector('h3')?.textContent?.trim() || 'Unknown';
            const url = card.href;
            const category = card.closest('.category')?.querySelector('h2')?.textContent || 'Unknown';
            umami.track('nav_link_click', { title, url, category });
          });
        });
      }
      
      // 7️⃣ 🎁 Console 彩蛋：輸入 neko() 觸發貓咪雨
      window.neko = function(count = 10) {
        const emojis = ['🐱', '🐾', '✨', '💜', '🎀'];
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            const el = document.createElement('div');
            el.className = 'neko-emoji';
            el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.bottom = '20px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1600);
          }, i * 120);
        }
        console.log('%c🐾 Neko mode activated! Try neko(20) for more!', 'color: #b388ff; font-size: 14px;');
      };
      console.log('%c🐾 Hello, Neko friend! Type neko() in console for a surprise~', 'color: #9b59b6; font-weight: bold;');
    });
  </script>
</body>
</html>
