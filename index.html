<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neko no akuma | 導航站</title>
  <!-- 設置 favicon -->
  <link rel="icon" type="image/png" href="https://cdn.dybts.qzz.io/images/neko_icon.png">
  <link rel="apple-touch-icon" href="https://cdn.dybts.qzz.io/images/neko_icon.png">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f8f9fa;
      --text-color: #333;
      --card-bg: #ffffff;
      --hover-color: #0056b3;
      --yt-color: #ff0000;
      --twitch-color: #9146ff;
      --x-color: #000000;
      --discord-color: #5865f2;
      --dybts-color: #43b581;
      --kamitsubaki-color: #2eb6e8;
      --bahamut-color: #00b4d8;
    }

    body {
      font-family: 'Segoe UI', 'Microsoft JhengHei', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 1.5rem;
      border: 4px solid var(--primary-color);
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    .description {
      font-size: 1rem;
      color: #666;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 0.9rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 1.5rem 0 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-title::before, .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #eee;
      margin: 0 10px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      text-decoration: none;
      color: #fff;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      position: relative;
    }

    .link-card i {
      font-size: 1.3rem;
      width: 25px;
      margin-right: 15px;
      text-align: center;
    }

    .link-card span {
      flex-grow: 1;
      text-align: center;
      margin-right: 25px;
    }

    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      filter: brightness(1.1);
    }

    /* Brand Colors */
    .youtube { background-color: var(--yt-color); }
    .twitch { background-color: var(--twitch-color); }
    .x-twitter { background-color: var(--x-color); }
    .discord { background-color: var(--discord-color); }
    .dybts { background-color: var(--dybts-color); }
    .kamitsubaki { background-color: var(--kamitsubaki-color); }
    .bahamut { background-color: var(--bahamut-color); }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="avatar" src="https://cdn.dybts.qzz.io/images/neko_icon.png" alt="Neko no akuma">
    <h1>Neko no akuma</h1>
    <p class="description">Discord 機器人 DYBTS 運營者</p>

    <div class="section-title"><i class="fas fa-share-nodes"></i> 社群媒體</div>
    <div class="links">
      <a href="https://www.youtube.com/@neko_tw" target="_blank" class="link-card youtube">
        <i class="fab fa-youtube"></i>
        <span>YouTube</span>
      </a>
      
      <a href="https://twitch.tv/nekonoakumatw" target="_blank" class="link-card twitch">
        <i class="fab fa-twitch"></i>
        <span>Twitch</span>
      </a>

      <a href="https://x.com/Nekonoakuma" target="_blank" class="link-card x-twitter">
        <i class="fab fa-x-twitter"></i>
        <span>X (Twitter)</span>
      </a>

      <a href="https://home.gamer.com.tw/profile/index.php?&owner=keynes970818" target="_blank" class="link-card bahamut">
        <i class="fas fa-bolt"></i>
        <span>巴哈姆特小屋</span>
      </a>
    </div>

    <div class="section-title"><i class="fab fa-discord"></i> Discord 群組</div>
    <div class="links">
      <a href="https://discord.gg/7AHak4nSbE" target="_blank" class="link-card discord">
        <i class="fab fa-discord"></i>
        <span>官方 Discord 群組</span>
      </a>

      <a href="https://discord.gg/VunJzQgeq5" target="_blank" class="link-card discord">
        <i class="fab fa-discord"></i>
        <span>神椿魔女交流社</span>
      </a>
    </div>

    <div class="section-title"><i class="fas fa-window-restore"></i> 運營網站</div>
    <div class="links">
      <a href="https://dybts.qzz.io" target="_blank" class="link-card dybts">
        <i class="fas fa-robot"></i>
        <span>DYBTS 官網</span>
      </a>

      <a href="https://kamitsubaki.dpdns.org" target="_blank" class="link-card kamitsubaki">
        <i class="fas fa-globe"></i>
        <span>神椿資訊網站</span>
      </a>

      <a href="https://twevent.kamitsubaki.qzz.io" target="_blank" class="link-card kamitsubaki">
        <i class="fas fa-calendar-check"></i>
        <span>神椿台灣粉絲活動組</span>
      </a>
    </div>

    <footer>
      &copy; 2026 Neko no akuma. All rights reserved.
    </footer>
  </div>
</body>
</html>
